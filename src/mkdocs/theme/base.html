<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{{ page.title }}</title>
        <link rel="icon" href="data:image/svg+xml,&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 100 100&quot;&gt;&lt;text y=&quot;.9em&quot; font-size=&quot;90&quot;&gt;📘&lt;/text&gt;&lt;/svg&gt;">
        <style>
/* Color scheme */

:root {
    --fg-color: #f0f6fc;
    --muted-fg-color: #9198a1;
    --neutral-color: #3d444d;
    --bg-color: #151b23;

    --link-color: #4493f8;
    --code-bg-color: #0d1117;

    --accent-note: #0969da;
    --accent-tip: #1a7f37;
    --accent-important:#8250df;
    --accent-warning: #9a6700;
    --accent-caution: #d1242f;
}

/* Basic reset */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-weight: 300;
}

/* Layout... */

main {
    margin: 0 auto;
    max-width: 700px;
    width: 60%;
    padding: 1rem 0;
}

@media (max-width: 1000px) {
    main {
        width: 75%;
    }

    nav.toc {
        display: none;
    }
}

@media (max-width: 600px) {
    main {
        width: 100%;
        padding: 1rem 1.5rem;
    }
}

/* Typography & spacing */

html {
    scroll-behavior: smooth;
}

body {
    line-height: 1.6;
    color: var(--fg-color);
    background-color: var(--bg-color);
    font-family: Helvetica, sans-serif;
}

h1, h2, h3, h4, h5 {
    margin-top: 1.5rem;
    margin-bottom: 1.5rem;
    line-height: 1.3;
}

h1 {
    border-bottom: 1px solid var(--neutral-color);
}
h2 {
    border-bottom: 1px solid var(--neutral-color);
}

p {
    margin: 1rem 0;
}

strong {
    font-weight: 600;
}

ul, ol {
    padding-left: 2rem;
}

li {
    margin: 0.5rem 0;
}

hr {
    margin-top: 1rem;
    margin-bottom: 1rem;
    border: none;
    border-top: 4px solid;
    color: var(--neutral-color);
}

blockquote {
    border-left: 0.25rem solid var(--neutral-color);
    padding: 0 1rem;
    color: var(--muted-fg-color);
}

pre {
    padding: 1rem;
    overflow-x: scroll;
    background-color:  var(--code-bg-color);
}

code {
    padding: 0 5px;
    background-color: var(--code-bg-color);
}

pre code {
    padding: 0;
}

img {
    max-width: 100%
}

a {
    color: var(--link-color);
    text-decoration: none;
}

a:hover {
    text-decoration: underline;
}

/* Tables */

table {
    border-collapse: collapse;
}

th, td {
    padding: 6px 13px;
    border: 1px solid var(--neutral-color);
}

/* Header anchor links */

a.toclink {
    color: inherit;
    text-decoration: none;
}

a.toclink:hover::after {
    content: "#";
    margin: 0 0.8rem;
    color: var(--neutral-color);
}

/* Table of contents styling */

nav.toc {
    position: fixed;
    margin-left: 80%;
    width : 20%;
    padding: 2rem;
    height: 100%;
    overflow-y: scroll;
}

/* Navigation styling */

nav.toc ul {
    padding: 0;
    margin: 0;
}

nav.toc li {
    padding: 0;
    margin: 0.5rem 0;
    display: block;
}

nav.toc li a.active {
    color: var(--link-color);
}

nav.toc li a:hover {
    color: var(--link-color);
    text-decoration: none;
}

nav.toc li a {
    color: var(--muted-fg-color);
}

nav.toc li a:hover {
    color: var(--fg-color);
    text-decoration: none;
}
        </style>
    </head>
    <body>
        <nav class="toc">
            {{ page.toc }}
        </nav>
        <main>
            {{ page.html }}
        </main>
    </body>
</html>
